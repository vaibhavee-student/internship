spring.application.name=neuroforge-nexus
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/neuroforge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-this-to-a-long-random-secret-key-123456789}
app.jwt.expiration-ms=86400000
